<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temparature converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
    <h1>Temparature converter</h1>
    <input type="number" id="numBox" value="0"><br>
    <input type="radio" id="ToFairh" name="unit">
    <label for="ToFairh">Celcius to Farenheight</label><br>

    <input type="radio" id="ToCel" name="unit">
    <label for="ToCel">Farenheight to Celcius</label><br>

    <button type="button" onclick="convert()">Convert</button>
    <p id="result">Select a unit</p>
    </form>
</body>
</html>
